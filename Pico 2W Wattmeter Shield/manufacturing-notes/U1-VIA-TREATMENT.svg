r="middle" fill="#9e1414">5</text></g><text x="810" y="250" font-family="Arial,sans-serif" font-size="26" text-anchor="start" fill="#182c42">Apply to the five numbered holes:</text><text x="820" y="310" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#182c42">1    X 133.081114    Y 89.499999 mm</text><text x="820" y="355" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#182c42">2    X 133.081114    Y 88.899999 mm</text><text x="820" y="400" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#182c42">3    X 132.481114    Y 89.499999 mm</text><text x="820" y="445" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#182c42">4    X 133.681114    Y 89.499999 mm</text><text x="820" y="490" font-family="Arial,sans-serif" font-size="22" text-anchor="start" fill="#182c42">5    X 133.081114    Y 90.099999 mm</text><text x="810" y="590" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#182c42">Fill with nonconductive epoxy; planarize;</text><text x="810" y="627" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#182c42">copper-cap for a flat solderable surface.</text><text x="810" y="664" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#182c42">All other vias retain specified treatment.</text><text x="810" y="701" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#182c42">Do not select every 0.30 mm drill.</text><text x="810" y="738" font-family="Arial,sans-serif" font-size="23" text-anchor="start" fill="#182c42">Five of seventeen 0.30 mm vias are selected.</text><text x="55" y="910" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#182c42">Coordinates use the PCB editor origin and positive-down Y. The matching Excellon export uses negative Y.</text><text x="55" y="950" font-family="Arial,sans-serif" font-size="21" text-anchor="start" fill="#182c42">U1 copper paddle: 1.8 × 1.8 mm. Preserve the four 0.65 × 0.65 mm paste windows in the stencil file.</text><text x="55" y="990" font-family="Arial,sans-serif" font-size="16" text-anchor="start" fill="#182c42">Source PCB SHA-256: e854d7cfd099d28c233fb6e8c8c7aefd3871ac11fafe0790f266644e90236ca2</text><text x="55" y="1025" font-family="Arial,sans-serif" font-size="19" text-anchor="start" fill="#182c42">Confirm selective treatment with the fabricator; this drawing is not evidence that the process was ordered.</text></svg>
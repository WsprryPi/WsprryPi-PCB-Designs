<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
 <title id="title">Proposed KDS 25 MHz TCXO to Si5351A reference circuit</title>
 <desc id="desc">KDS pins one and two are grounded, pin four takes 3.3 volts with local bypassing, and output pin three couples through one nanofarad to Si5351A XA pin two. XB pin three floats. Synthesizer supply pins one and seven each have 100 nanofarad bypasses. Values are a proposal, not a verified QRP Labs BOM.</desc>

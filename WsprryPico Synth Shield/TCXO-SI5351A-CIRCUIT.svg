 <g font-family="Arial, sans-serif" font-size="17" fill="#172535">
  <text x="372" y="635">Local supply bypasses: C31 = 100 nF from U31.1 to GND; C32 = 100 nF from U31.7 to GND.</text>
  <text x="372" y="666">C21/C22 follow the KDS measurement fixture. Skyworks' XA example uses 100 nF series coupling.</text>
  <text x="372" y="696">No crystal, no XB ground connection, no 50 Ω reference load. See the design notes for limits.</text>
